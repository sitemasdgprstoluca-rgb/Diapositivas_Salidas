name: Release mobile APK

# Genera un APK firmado y lo publica como GitHub Release.
# Las URLs de GitHub Releases NO caducan (a diferencia de los enlaces
# de EAS Build que expiran a los 30 días).
#
# Disparadores:
#   1. Push de un tag con formato v*.*.* (ej: v1.0.1, v1.2.0)
#   2. Manual desde la pestaña "Actions" de GitHub
#
# Requiere secrets en GitHub:
#   - EXPO_TOKEN: token de https://expo.dev/accounts/.../settings/access-tokens

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a buildear (ej: 1.0.1)'
        required: true
        default: '1.0.0'

jobs:
  build-and-release:
    name: Build APK + GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: supervision-cprs
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: supervision-cprs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger EAS build (preview profile, APK)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Build sincrónico, devuelve URL de descarga al terminar
          eas build --platform android --profile preview --non-interactive --json --wait > build-result.json
          cat build-result.json
          echo "BUILD_URL=$(jq -r '.[0].artifacts.buildUrl' build-result.json)" >> $GITHUB_ENV
          echo "BUILD_VERSION=$(jq -r '.[0].appVersion' build-result.json)" >> $GITHUB_ENV

      - name: Download APK from EAS
        run: |
          curl -L "${{ env.BUILD_URL }}" -o "supervision-cprs-${{ env.BUILD_VERSION }}.apk"
          ls -la *.apk

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Supervisión CPRS ${{ steps.tag.outputs.tag }}
          body: |
            APK firmado para distribución en teléfonos y tablets Android.

            - Compatible con Android 7.0+ (API 24+)
            - Soporta orientación portrait y landscape (tablets)
            - Backend: Supabase (proyecto institucional)

            **Cómo instalar**:
            1. Descarga el APK desde la sección Assets abajo.
            2. En el dispositivo: Ajustes → Seguridad → Permitir orígenes desconocidos.
            3. Abre el archivo descargado e instala.

            **OTA**: una vez instalada, la app recibe correcciones automáticas
            (sin reinstalar) cuando se publican cambios en JS/UI.
          files: supervision-cprs/supervision-cprs-${{ env.BUILD_VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
